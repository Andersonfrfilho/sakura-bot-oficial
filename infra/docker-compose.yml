services:

  # Banco de dados principal (app + Typebot)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql
    ports:
      - "5432:5432"
    networks:
      - sakura_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (usado pelo n8n e pela API do Order Hub)
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sakura_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Orquestração de fluxos — recebe webhooks da Meta Cloud API
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=${N8N_HOST:-localhost}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678}
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_LOG_LEVEL=info
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      # WhatsApp Cloud API (Meta oficial)
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_BUSINESS_ACCOUNT_ID=${WHATSAPP_BUSINESS_ACCOUNT_ID}
      - WHATSAPP_WEBHOOK_VERIFY_TOKEN=${WHATSAPP_WEBHOOK_VERIFY_TOKEN}
      - WHATSAPP_API_VERSION=${WHATSAPP_API_VERSION:-v21.0}
      # Order Hub API — endpoints internos de conversas (substituem o Chatwoot)
      - ORDER_HUB_API_URL=${ORDER_HUB_API_URL:-http://order_hub_api:3333}
      - ORDER_HUB_N8N_INTERNAL_TOKEN=${ORDER_HUB_N8N_INTERNAL_TOKEN:-change-internal-token}
      - ORDER_HUB_WEB_PUBLIC_URL=${ORDER_HUB_WEB_PUBLIC_URL:-http://localhost:4000}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - sakura_net
    depends_on:
      postgres:
        condition: service_healthy

  # Builder de chatbot
  typebot-builder:
    image: baptistearno/typebot-builder:latest
    container_name: typebot_builder
    restart: always
    ports:
      - "3001:3000"
    environment:
      - NEXTAUTH_URL=${TYPEBOT_URL:-http://localhost:3001}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/typebot
    networks:
      - sakura_net
    depends_on:
      postgres:
        condition: service_healthy

  typebot-viewer:
    image: baptistearno/typebot-viewer:latest
    container_name: typebot_viewer
    restart: always
    ports:
      - "3002:3000"
    environment:
      - NEXTAUTH_URL=${TYPEBOT_VIEWER_URL:-http://localhost:3002}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/typebot
    networks:
      - sakura_net
    depends_on:
      postgres:
        condition: service_healthy

  # Painel admin do estabelecimento (cardápio, horários, configurações)
  directus:
    image: directus/directus:latest
    container_name: directus
    restart: always
    ports:
      - "8055:8055"
    environment:
      SECRET: ${DIRECTUS_SECRET}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      PUBLIC_URL: ${DIRECTUS_URL:-http://localhost:8055}
      WEBSOCKETS_ENABLED: "true"
      AUTH_PROVIDERS: ${DIRECTUS_AUTH_PROVIDERS:-}
      AUTH_KEYCLOAK_DRIVER: openid
      AUTH_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      AUTH_KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      AUTH_KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL:-}
      EXTENSIONS_AUTO_RELOAD: "true"
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions
    networks:
      - sakura_net
    depends_on:
      postgres:
        condition: service_healthy

  # Simulador de conversa com o bot (preview)
  preview:
    image: nginx:alpine
    container_name: preview
    restart: always
    ports:
      - "9001:80"
    volumes:
      - ../preview:/usr/share/nginx/html:ro
    networks:
      - sakura_net

  # Order Hub — API de gestão de pedidos (Bun + uWebSockets.js + Drizzle)
  order-hub-api:
    image: node:22
    container_name: order_hub_api
    # @adatechnology/fiscal-provider ainda vem por "file:" do monorepo irmão, que por isso
    # precisa estar montado aqui dentro. Já o meta-whatsapp-provider vem do registry, como no
    # quickcart: ele passou a depender de outro pacote por "workspace:*" (pnpm), e `npm install`
    # dentro do diretório fonte não sabe resolver esse protocolo.
    # ATENÇÃO: o bind do repo irmão só funciona em dev local. Deploy (Railway) não tem acesso a
    # esse diretório — publicar o fiscal-provider ou vendorizar antes de subir prod.
    working_dir: /workspace/apps/api
    command: >
      sh -c "cd /adatechnology-packages/packages/backend/fiscal-provider && npm install && npm run build &&
             cd /workspace && npm install --workspaces --include-workspace-root &&
             cd apps/api && npx drizzle-kit generate && npx tsx watch src/index.ts"
    volumes:
      - ..:/workspace
      - ../../adatechnology-packages:/adatechnology-packages
      - api_node_modules:/workspace/apps/api/node_modules
      - fiscal_node_modules:/adatechnology-packages/packages/backend/fiscal-provider/node_modules
    environment:
      - PORT=3333
      - NODE_ENV=development
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${ORDER_HUB_JWT_SECRET:-changeme_jwt_32chars_troque_em_producao}
      - JWT_REFRESH_SECRET=${ORDER_HUB_JWT_REFRESH_SECRET:-changeme_refresh_32chars_troque}
      - JWT_ACCESS_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - WEBHOOK_SECRET=${ORDER_HUB_WEBHOOK_SECRET:-changeme_hmac_secret_compartilhado}
      - N8N_INTERNAL_API_TOKEN=${ORDER_HUB_N8N_INTERNAL_TOKEN:-change-internal-token}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_API_VERSION=${WHATSAPP_API_VERSION:-v21.0}
      - WHATSAPP_BUSINESS_ACCOUNT_ID=${WHATSAPP_BUSINESS_ACCOUNT_ID}
      - WHATSAPP_WEBHOOK_VERIFY_TOKEN=${WHATSAPP_WEBHOOK_VERIFY_TOKEN}
      - WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET}
      - ALLOWED_ORIGINS=http://localhost:4000
      - LOG_LEVEL=info
    ports:
      - "3333:3333"
    networks:
      - sakura_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Order Hub — Painel operacional (React + Vite em modo dev)
  order-hub-web:
    image: node:22-alpine
    container_name: order_hub_web
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ../apps/web:/app
      - web_node_modules:/app/node_modules
      # @adatechnology/conversations-ui e products-ui entram por "file:" do monorepo irmão: o
      # symlink em node_modules aponta para fora de /app e sem este bind o Vite não resolve o
      # import. Mesmo caminho que o symlink espera resolver a partir de /app/node_modules.
      - ../../adatechnology-packages:/adatechnology-packages
    environment:
      # URLs como vistas pelo BROWSER (host), não pelo Docker network
      - VITE_API_URL=http://localhost:3333
      - VITE_API_WS_URL=ws://localhost:3333/ws
    ports:
      - "4000:4000"
    networks:
      - sakura_net
    depends_on:
      - order-hub-api

  # Gerenciamento de registros (cardápio, FAQ, pedidos, reservas)
  adminer:
    image: adminer:latest
    container_name: adminer
    restart: always
    ports:
      - "8181:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
      - ADMINER_DESIGN=pepa-linha
    networks:
      - sakura_net
    depends_on:
      postgres:
        condition: service_healthy

  # Painel administrativo (pedidos, reservas, cardápio, FAQ, relatórios)
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    restart: always
    ports:
      - "4100:3000"
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_HOST=postgres
      - MB_DB_PORT=5432
      - MB_DB_DBNAME=metabase
      - MB_DB_USER=${POSTGRES_USER}
      - MB_DB_PASS=${POSTGRES_PASSWORD}
      - MB_SITE_LOCALE=pt
    networks:
      - sakura_net
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  directus_uploads:
  directus_extensions:
  api_node_modules:
  web_node_modules:
  fiscal_node_modules:

networks:
  sakura_net:
    driver: bridge
